<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 200" width="580" height="200" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">
  <rect width="580" height="200" fill="#0a0e27"/>

  <!-- Title -->
  <text x="16" y="20" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2">BADGE VARIANTS</text>

  <!-- default -->
  <rect x="16" y="32" width="60" height="24" rx="12" fill="#94a3b8" fill-opacity="0.1" stroke="#94a3b8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="46" y="48" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DEFAULT</text>

  <!-- primary -->
  <rect x="88" y="32" width="60" height="24" rx="12" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <text x="118" y="48" font-size="9" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">PRIMARY</text>

  <!-- secondary -->
  <rect x="160" y="32" width="72" height="24" rx="12" fill="#00d4ff" fill-opacity="0.1" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="196" y="48" font-size="9" font-weight="600" fill="#00d4ff" text-anchor="middle" letter-spacing="1">SECONDARY</text>

  <!-- success -->
  <rect x="244" y="32" width="60" height="24" rx="12" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <text x="274" y="48" font-size="9" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">SUCCESS</text>

  <!-- warning -->
  <rect x="316" y="32" width="64" height="24" rx="12" fill="#ffaa00" fill-opacity="0.1" stroke="#ffaa00" stroke-opacity="0.3" stroke-width="1"/>
  <text x="348" y="48" font-size="9" font-weight="600" fill="#ffaa00" text-anchor="middle" letter-spacing="1">WARNING</text>

  <!-- danger -->
  <rect x="392" y="32" width="56" height="24" rx="12" fill="#ff3366" fill-opacity="0.1" stroke="#ff3366" stroke-opacity="0.3" stroke-width="1"/>
  <text x="420" y="48" font-size="9" font-weight="600" fill="#ff3366" text-anchor="middle" letter-spacing="1">DANGER</text>

  <!-- outline -->
  <rect x="460" y="32" width="56" height="24" rx="12" fill="none" stroke="#94a3b8" stroke-opacity="0.4" stroke-width="1"/>
  <text x="488" y="48" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">OUTLINE</text>

  <!-- Divider -->
  <line x1="16" y1="70" x2="564" y2="70" stroke="#2d3748" stroke-width="1"/>
  <text x="16" y="88" font-size="8" fill="#64748b" letter-spacing="1">SIZES</text>

  <!-- sm -->
  <rect x="16" y="96" width="44" height="20" rx="10" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <text x="38" y="110" font-size="8" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">SM</text>
  <text x="38" y="128" font-size="8" fill="#64748b" text-anchor="middle">h-5 / 20px</text>

  <!-- md -->
  <rect x="72" y="93" width="44" height="24" rx="12" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <text x="94" y="110" font-size="9" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">MD</text>
  <text x="94" y="130" font-size="8" fill="#64748b" text-anchor="middle">h-6 / 24px</text>

  <!-- lg -->
  <rect x="128" y="89" width="48" height="32" rx="16" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <text x="152" y="110" font-size="11" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">LG</text>
  <text x="152" y="134" font-size="8" fill="#64748b" text-anchor="middle">h-8 / 32px</text>

  <!-- Divider -->
  <line x1="16" y1="150" x2="564" y2="150" stroke="#2d3748" stroke-width="1"/>
  <text x="16" y="166" font-size="8" fill="#64748b" letter-spacing="1">WITH ICON</text>

  <!-- badge with icon example -->
  <rect x="16" y="172" width="80" height="24" rx="12" fill="#00ff41" fill-opacity="0.1" stroke="#00ff41" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="32" cy="184" r="4" fill="#00ff41"/>
  <text x="60" y="188" font-size="9" font-weight="600" fill="#00ff41" text-anchor="middle" letter-spacing="1">ACTIVE</text>
</svg>
