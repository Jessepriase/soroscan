<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" font-family="'JetBrains Mono', 'IBM Plex Mono', monospace">
  <rect width="600" height="260" fill="#0a0e27"/>

  <!-- Title -->
  <text x="16" y="22" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="2" text-anchor="start">BUTTON VARIANTS</text>

  <!-- Row 1: default -->
  <rect x="16" y="36" width="88" height="36" rx="8" fill="#00ff41"/>
  <text x="60" y="59" font-size="11" font-weight="500" fill="#0a0e27" text-anchor="middle">DEFAULT</text>

  <!-- Row 1: destructive -->
  <rect x="116" y="36" width="104" height="36" rx="8" fill="#ff3366"/>
  <text x="168" y="59" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle">DESTRUCTIVE</text>

  <!-- Row 1: outline -->
  <rect x="232" y="36" width="88" height="36" rx="8" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <text x="276" y="59" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">OUTLINE</text>

  <!-- Row 1: secondary -->
  <rect x="332" y="36" width="96" height="36" rx="8" fill="#00d4ff" fill-opacity="0.15"/>
  <text x="380" y="59" font-size="11" font-weight="500" fill="#00d4ff" text-anchor="middle">SECONDARY</text>

  <!-- Row 1: ghost -->
  <rect x="440" y="36" width="72" height="36" rx="8" fill="none"/>
  <text x="476" y="59" font-size="11" font-weight="500" fill="#e2e8f0" text-anchor="middle">GHOST</text>

  <!-- Row 1: link -->
  <text x="530" y="59" font-size="11" font-weight="500" fill="#00ff41" text-anchor="middle" text-decoration="underline">LINK</text>

  <!-- Divider -->
  <line x1="16" y1="86" x2="584" y2="86" stroke="#2d3748" stroke-width="1"/>

  <!-- Size labels -->
  <text x="16" y="106" font-size="8" fill="#64748b" letter-spacing="1">SIZES</text>

  <!-- xs -->
  <rect x="16" y="112" width="48" height="24" rx="6" fill="#00ff41"/>
  <text x="40" y="128" font-size="9" font-weight="500" fill="#0a0e27" text-anchor="middle">XS</text>
  <text x="40" y="148" font-size="8" fill="#64748b" text-anchor="middle">24px</text>

  <!-- sm -->
  <rect x="76" y="108" width="56" height="32" rx="8" fill="#00ff41"/>
  <text x="104" y="128" font-size="10" font-weight="500" fill="#0a0e27" text-anchor="middle">SM</text>
  <text x="104" y="152" font-size="8" fill="#64748b" text-anchor="middle">32px sm:</text>

  <!-- default -->
  <rect x="144" y="104" width="72" height="36" rx="8" fill="#00ff41"/>
  <text x="180" y="126" font-size="11" font-weight="500" fill="#0a0e27" text-anchor="middle">DEFAULT</text>
  <text x="180" y="154" font-size="8" fill="#64748b" text-anchor="middle">36px sm:</text>

  <!-- lg -->
  <rect x="228" y="100" width="72" height="44" rx="8" fill="#00ff41"/>
  <text x="264" y="126" font-size="12" font-weight="500" fill="#0a0e27" text-anchor="middle">LARGE</text>
  <text x="264" y="158" font-size="8" fill="#64748b" text-anchor="middle">44px</text>

  <!-- icon -->
  <rect x="316" y="104" width="36" height="36" rx="8" fill="#00ff41"/>
  <text x="334" y="127" font-size="14" fill="#0a0e27" text-anchor="middle">◆</text>
  <text x="334" y="154" font-size="8" fill="#64748b" text-anchor="middle">ICON</text>

  <!-- Divider -->
  <line x1="16" y1="172" x2="584" y2="172" stroke="#2d3748" stroke-width="1"/>

  <!-- States label -->
  <text x="16" y="190" font-size="8" fill="#64748b" letter-spacing="1">STATES</text>

  <!-- Default state -->
  <rect x="16" y="198" width="80" height="36" rx="8" fill="#00ff41"/>
  <text x="56" y="221" font-size="10" font-weight="500" fill="#0a0e27" text-anchor="middle">DEFAULT</text>

  <!-- Hover state -->
  <rect x="108" y="198" width="80" height="36" rx="8" fill="#00e63a"/>
  <text x="148" y="215" font-size="10" font-weight="500" fill="#0a0e27" text-anchor="middle">HOVER</text>
  <text x="148" y="227" font-size="8" fill="#64748b" text-anchor="middle">bg/90</text>

  <!-- Focus state -->
  <rect x="200" y="194" width="80" height="36" rx="8" fill="#00ff41" stroke="#00ff41" stroke-width="3" stroke-opacity="0.5"/>
  <text x="240" y="215" font-size="10" font-weight="500" fill="#0a0e27" text-anchor="middle">FOCUS</text>
  <text x="240" y="227" font-size="8" fill="#64748b" text-anchor="middle">ring 3px</text>

  <!-- Disabled state -->
  <rect x="292" y="198" width="80" height="36" rx="8" fill="#00ff41" opacity="0.5"/>
  <text x="332" y="215" font-size="10" font-weight="500" fill="#0a0e27" text-anchor="middle">DISABLED</text>
  <text x="332" y="227" font-size="8" fill="#64748b" text-anchor="middle">opacity-50</text>
</svg>
