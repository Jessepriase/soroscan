# Mock schema for development when backend is not available
# Replace this with actual schema introspection when backend is running

type Query {
  # Events
  events(contractId: String, first: Int!): EventConnection!

  # Auth / user
  me: User

  # Admin / system
  systemMetrics: SystemMetrics!
  recentErrors(limit: Int): [ErrorLog!]!

  # Organizations (#913)
  myOrganizations: [Organization!]!
  organization(id: String!): Organization
  teamMembers(organizationId: String!): [TeamMember!]!
  teamInvitations(organizationId: String!): [TeamInvitation!]!
  organizationActivity(organizationId: String!): [OrgActivityEntry!]!

  # Contract Dependency Graph (#922)
  contracts(filter: ContractFilter): [ContractWithDeps!]!
}

input ContractFilter {
  name: String
  vulnerabilityType: String
}

type DataExportResponse {
  requestId: String!
  status: String!
  expiresAt: String!
  downloadUrl: String
}

type DeletionRequestResponse {
  requestId: String!
  status: String!
  approvalDate: String
}


type Mutation {
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refresh: String!): AuthPayload!
  requestGDPRDataExport(organizationId: String!, format: String!): DataExportResponse!
  requestRightToBeForgotten(userId: String!, reason: String): DeletionRequestResponse!

  createOrganization(input: CreateOrganizationInput!): Organization!
  updateOrganization(id: String!, input: UpdateOrganizationInput!): Organization!
  inviteTeamMember(organizationId: String!, email: String!, role: OrgRole!): InviteResult!
  updateTeamMemberRole(organizationId: String!, memberId: String!, role: OrgRole!): TeamMember!
  removeTeamMember(organizationId: String!, memberId: String!): Boolean!
  resendInvitation(organizationId: String!, invitationId: String!): TeamInvitation!
  cancelInvitation(organizationId: String!, invitationId: String!): Boolean!
  switchOrganization(organizationId: String!): Organization!
}

type Subscription {
  contractEvent(contractId: String!): ContractEvent!
}

type AuthPayload {
  access: String!
  refresh: String!
  user: User!
}

type User {
  id: ID!
  email: String!
  activeOrganizationId: String
}

type SystemMetrics {
  eventsIndexedToday: Int!
  eventsIndexedTotal: Int!
  webhookSuccessRate: Float!
  avgWebhookDeliveryTime: Float!
  activeContracts: Int!
  lastSynced: String
  dbStatus: String!
  redisStatus: String!
}

type ErrorLog {
  id: ID!
  timestamp: String!
  level: String!
  message: String!
  context: String
}

type EventConnection {
  edges: [EventEdge!]!
}

type EventEdge {
  node: Event!
}

type Event {
  id: ID!
  contractId: String!
  eventType: String!
  data: String!
  createdAt: String!
}

type ContractEvent {
  id: ID!
  eventType: String!
  ledgerSequence: Int!
  timestamp: String!
  payload: String!
}

enum OrgRole {
  owner
  admin
  operator
  viewer
}

enum DataRegion {
  us_east
  eu_west
  ap_southeast
}

type Organization {
  id: ID!
  name: String!
  billingContact: String!
  dataRegion: DataRegion!
  createdAt: String!
  contractCount: Int!
  webhookLimit: Int!
}

type TeamMember {
  id: ID!
  email: String!
  role: OrgRole!
  joinedAt: String!
  lastActiveAt: String
}

type TeamInvitation {
  id: ID!
  email: String!
  role: OrgRole!
  invitedAt: String!
  expiresAt: String!
  status: String!
}

type OrgActivityEntry {
  id: ID!
  action: String!
  actorEmail: String!
  targetEmail: String
  detail: String!
  timestamp: String!
}

type InviteResult {
  success: Boolean!
  invitationId: String
  message: String!
}

input CreateOrganizationInput {
  name: String!
  billingContact: String!
  dataRegion: DataRegion!
}

input UpdateOrganizationInput {
  name: String
  billingContact: String
  dataRegion: DataRegion
}

# ── Contract Dependency Graph (#922) ──────────────────────────────────────────

enum VulnerabilitySeverity {
  CRITICAL
  HIGH
  MEDIUM
  LOW
  NONE
}

enum DependencyType {
  DIRECT
  INDIRECT
  CIRCULAR
}

type ContractVulnerability {
  id: ID!
  title: String!
  severity: VulnerabilitySeverity!
  impactedContracts: [String!]!
}

type ContractDependency {
  id: ID!
  contractAddress: String!
  contractName: String!
  dependencyType: DependencyType!
}

type ContractDependent {
  id: ID!
  contractAddress: String!
  contractName: String!
}

type ContractWithDeps {
  id: ID!
  name: String!
  address: String!
  riskScore: Float!
  reachabilityPct: Float!
  vulnerabilities: [ContractVulnerability!]!
  dependencies: [ContractDependency!]!
  dependents: [ContractDependent!]!
}
